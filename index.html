
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Todo Task Manager</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
                <h1>Task<span>Flow</span></h1>
                <p class="subtitle">Plan your day. Get things done.</p>
            </div>

            <div class="date-badge" id="todayDate"></div>
        </header>

        <!-- Dashboard Statistics -->
        <section class="stats">
            <div class="stat-card">
                <span class="stat-icon">📋</span>
                <p>Total Tasks</p>
                <h2 id="totalTasks">0</h2>
            </div>

            <div class="stat-card">
                <span class="stat-icon">⏳</span>
                <p>Pending</p>
                <h2 id="pendingTasks">0</h2>
            </div>

            <div class="stat-card">
                <span class="stat-icon">✅</span>
                <p>Completed</p>
                <h2 id="completedTasks">0</h2>
            </div>
        </section>

        <!-- Add or Edit Task Form -->
        <section class="panel">
            <h2 id="formHeading">Create a New Task</h2>
            <p class="muted">Add your task details below.</p>

            <form id="taskForm">
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label for="taskTitle">Task Title *</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="e.g. Complete HTML assignment"
                        maxlength="120"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea
                        id="taskDescription"
                        placeholder="Add some details..."
                        rows="3"
                        maxlength="500"
                    ></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskDeadline">Deadline</label>
                        <input type="date" id="taskDeadline">
                    </div>
                </div>

                <div class="form-actions">
                    <button
                        type="submit"
                        class="btn-primary"
                        id="submitBtn"
                    >
                        + Add Task
                    </button>

                    <button
                        type="button"
                        class="btn-secondary hidden"
                        id="cancelEdit"
                    >
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <!-- Task List -->
        <section class="tasks-section">
            <div class="tasks-heading">
                <div>
                    <h2>My Tasks</h2>
                    <p class="muted">Keep track of your progress.</p>
                </div>

                <button
                    type="button"
                    id="clearCompleted"
                    class="text-button"
                >
                    Clear completed
                </button>
            </div>

            <!-- Search and Filters -->
            <div class="toolbar">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                    aria-label="Search tasks"
                >

                <select id="filterStatus" aria-label="Filter by status">
                    <option value="All">All Tasks</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>

                <select
                    id="filterPriority"
                    aria-label="Filter by priority"
                >
                    <option value="All">All Priorities</option>
                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
            </div>

            <div id="taskList" class="task-list"></div>

            <p id="emptyMessage" class="empty-message">
                No tasks found. Add your first task above! ✨
            </p>
        </section>

        <!-- Footer -->
        <footer>
            <p>Made with 💜 | TaskFlow Todo Manager</p>
        </footer>

    </div>
</body>
</html>
